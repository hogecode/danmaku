version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: danmaku_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: danmaku
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - danmaku_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d danmaku"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: danmaku_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - danmaku_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  danmaku_network:
    driver: bridge
