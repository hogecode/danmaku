name: mobile
description: Danmaku Video Player for Flutter - MP4 & Comment Streaming

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter

  # Video Playback
  video_player: ^2.11.0

  # State Management
  flutter_riverpod: ^3.0.0-dev.3
  riverpod_annotation: ^3.0.0-dev.3

  # API Client
  dio: ^5.4.0
  retrofit: ^4.1.0
  json_annotation: ^4.8.0

  # Localization
  intl: ^0.20.2

  # Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Logging
  logger: ^2.4.0

  # Fonts
  google_fonts: ^6.0.0

  # URL Launcher
  url_launcher: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.0
  retrofit_generator: ^8.2.1
  json_serializable: ^6.8.0
  hive_generator: ^2.0.0
  riverpod_generator: ^3.0.0-dev.11

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/
    - assets/images/
    - assets/icons/
