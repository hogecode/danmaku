name: Database Migration

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      migration_type:
        required: false
        type: string
        default: migrate
      image_tag:
        required: true
        type: string
        description: "Image tag to use for DB migration (must exist in ECR)"
    secrets:
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_ROLE_ARN:
        required: true
      ECR_NESTJS_REPOSITORY_NAME:
        required: true
      ECS_CLUSTER_NAME:
        required: true
      DB_SUBNET_IDS:
        required: true
      NESTJS_SECURITY_GROUP_ID:
        required: true

jobs:
  db-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Debug AWS credentials
        run: |
          echo "🔍 AWS Configuration:"
          echo "  Region: ${{ secrets.AWS_REGION }}"
          echo "  Account ID: ${{ secrets.AWS_ACCOUNT_ID }}"
          echo "  ECR Repo: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}"
          echo ""
          echo "🔧 Testing AWS CLI:"
          aws sts get-caller-identity --no-paginate
          echo ""
          echo "✅ AWS CLI works"

      - name: Verify image tag exists in ECR
        id: verify-tag
        run: |
          echo "🔍 Verifying image tag exists in ECR..."
          IMAGE_TAG="${{ inputs.image_tag }}"
          REPO_NAME="${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}"
          REGION="${{ secrets.AWS_REGION }}"
          
          echo "📌 Looking for: $REPO_NAME:$IMAGE_TAG in $REGION"
          set -x  # Debug mode
          
          # Try to describe all images
          echo "🔧 Listing all images in repository..."
          IMAGE_INFO=$(aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --region "$REGION" \
            --output json 2>&1)
          
          AWS_EXIT=$?
          set +x
          
          if [ $AWS_EXIT -ne 0 ]; then
            echo "❌ AWS CLI failed with exit code $AWS_EXIT"
            echo "Error output:"
            echo "$IMAGE_INFO"
            exit 1
          fi
          
          echo "📦 Response received"
          
          # Check if tag exists
          TAG_EXISTS=$(echo "$IMAGE_INFO" | jq --arg TAG "$IMAGE_TAG" '[.imageDetails[] | select(.imageTags[]? == $TAG)] | length')
          
          if [ "$TAG_EXISTS" -eq 0 ]; then
            echo ""
            echo "❌ Image tag '$IMAGE_TAG' NOT FOUND in ECR repository '$REPO_NAME'"
            echo "📋 Available image tags (latest 20):"
            echo "$IMAGE_INFO" | jq -r '.imageDetails | sort_by(.imagePushedAt)[-20:] | .[].imageTags[]' 2>/dev/null | sort -u || echo "  [Unable to parse image tags]"
            echo ""
            exit 1
          fi
          
          echo ""
          echo "✅ Image verified: $REPO_NAME:$IMAGE_TAG"
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 🔄 Dry-Run Migration
        run: |
          chmod +x scripts/run-db-migration.sh
          scripts/run-db-migration.sh \
            "${{ inputs.environment }}" \
            "dry" \
            "${{ steps.verify-tag.outputs.tag }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_NESTJS_REPOSITORY: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          DB_SUBNET_IDS: ${{ secrets.DB_SUBNET_IDS }}
          NESTJS_SECURITY_GROUP_ID: ${{ secrets.NESTJS_SECURITY_GROUP_ID }}

      - name: 🚀 Run Migration
        if: inputs.migration_type == 'migrate'
        run: |
          chmod +x scripts/run-db-migration.sh
          scripts/run-db-migration.sh \
            "${{ inputs.environment }}" \
            "migrate" \
            "${{ steps.verify-tag.outputs.tag }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_NESTJS_REPOSITORY: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          DB_SUBNET_IDS: ${{ secrets.DB_SUBNET_IDS }}
          NESTJS_SECURITY_GROUP_ID: ${{ secrets.NESTJS_SECURITY_GROUP_ID }}
