name: Database Migration

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      migration_type:
        required: false
        type: string
        default: migrate
      image_tag:
        required: false
        type: string
    secrets:
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_ROLE_ARN:
        required: true
      ECR_NESTJS_REPOSITORY_NAME:
        required: true
      ECS_CLUSTER_NAME:
        required: true
      DB_SUBNET_IDS:
        required: true
      NESTJS_SECURITY_GROUP_ID:
        required: true

jobs:
  db-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔄 Dry-Run Migration
        run: |
          chmod +x scripts/run-db-migration.sh
          scripts/run-db-migration.sh \
            "${{ inputs.environment }}" \
            "dry" \
            "${{ inputs.image_tag || github.sha }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_NESTJS_REPOSITORY: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          DB_SUBNET_IDS: ${{ secrets.DB_SUBNET_IDS }}
          NESTJS_SECURITY_GROUP_ID: ${{ secrets.NESTJS_SECURITY_GROUP_ID }}

      - name: 🚀 Run Migration
        if: inputs.migration_type == 'migrate'
        run: |
          chmod +x scripts/run-db-migration.sh
          scripts/run-db-migration.sh \
            "${{ inputs.environment }}" \
            "migrate" \
            "${{ inputs.image_tag || github.sha }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_NESTJS_REPOSITORY: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          DB_SUBNET_IDS: ${{ secrets.DB_SUBNET_IDS }}
          NESTJS_SECURITY_GROUP_ID: ${{ secrets.NESTJS_SECURITY_GROUP_ID }}
