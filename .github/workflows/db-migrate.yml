name: Database Migration

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      migration_type:
        required: false
        type: string
        default: migrate
      image_tag:
        required: false
        type: string
    secrets:
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_ROLE_ARN:
        required: true
      ECR_NESTJS_REPOSITORY_NAME:
        required: true
      ECS_CLUSTER_NAME:
        required: true
      DB_SUBNET_IDS:
        required: true
      NESTJS_SECURITY_GROUP_ID:
        required: true

jobs:
  db-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get latest image tag
        id: latest-tag
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "🔍 Fetching latest image tag from ECR..."
            TAG=$(aws ecr describe-images \
              --repository-name "${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}" \
              --region ${{ secrets.AWS_REGION }} \
              --output json 2>/dev/null | jq -r '.imageDetails | sort_by(.imagePushedAt)[-1].imageTags[0]')
            
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "❌ No images found in ECR repository"
              echo "📋 Available repositories:"
              aws ecr describe-repositories --region ${{ secrets.AWS_REGION }} --query 'repositories[].repositoryName' --output text
              exit 1
            fi
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "📌 Latest image tag: ${TAG}"
          else
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "📌 Using specified image tag: ${{ inputs.image_tag }}"
          fi

      - name: 🔄 Dry-Run Migration
        run: |
          chmod +x scripts/run-db-migration.sh
          scripts/run-db-migration.sh \
            "${{ inputs.environment }}" \
            "dry" \
            "${{ steps.latest-tag.outputs.tag }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_NESTJS_REPOSITORY: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          DB_SUBNET_IDS: ${{ secrets.DB_SUBNET_IDS }}
          NESTJS_SECURITY_GROUP_ID: ${{ secrets.NESTJS_SECURITY_GROUP_ID }}

      - name: 🚀 Run Migration
        if: inputs.migration_type == 'migrate'
        run: |
          chmod +x scripts/run-db-migration.sh
          scripts/run-db-migration.sh \
            "${{ inputs.environment }}" \
            "migrate" \
            "${{ steps.latest-tag.outputs.tag }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_NESTJS_REPOSITORY: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
          DB_SUBNET_IDS: ${{ secrets.DB_SUBNET_IDS }}
          NESTJS_SECURITY_GROUP_ID: ${{ secrets.NESTJS_SECURITY_GROUP_ID }}
