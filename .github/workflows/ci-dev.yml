name: CI/CD - Dev Environment

on:
  workflow_dispatch:

env:
  ENVIRONMENT: dev
  IMAGE_TAG: dev-${{ github.sha }}
  # Extract short commit hash for image tagging
  COMMIT_HASH: ${{ github.sha }}
  SHORT_SHA: ${{ github.sha }}

permissions:
  contents: read # Read-only access to repository contents
  id-token: write # Required for OIDC authentication with cloud providers
  security-events: write # Required for security scanning (SARIF upload)

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.get-sha.outputs.short_sha }}
    steps:
      - name: Get short commit SHA
        id: get-sha
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    uses: ./.github/workflows/build.yml
    with:
      image_tag: dev-${{ needs.setup.outputs.short_sha }}
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ECR_NEXTJS_REPOSITORY_NAME: ${{ secrets.ECR_NEXTJS_REPOSITORY_NAME }}
      ECR_NESTJS_REPOSITORY_NAME: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}

  scan:
    needs: [setup, build]
    uses: ./.github/workflows/scan.yml
    with:
      image_tag: dev-${{ needs.setup.outputs.short_sha }}
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ECR_NEXTJS_REPOSITORY_NAME: ${{ secrets.ECR_NEXTJS_REPOSITORY_NAME }}
      ECR_NESTJS_REPOSITORY_NAME: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}

  deploy:
    needs: [setup, scan]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: dev-${{ needs.setup.outputs.short_sha }}
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ECR_NEXTJS_REPOSITORY_NAME: ${{ secrets.ECR_NEXTJS_REPOSITORY_NAME }}
      ECR_NESTJS_REPOSITORY_NAME: ${{ secrets.ECR_NESTJS_REPOSITORY_NAME }}
      ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
      ECS_NEXTJS_SERVICE_NAME: ${{ secrets.ECS_NEXTJS_SERVICE_NAME }}
      ECS_NESTJS_SERVICE_NAME: ${{ secrets.ECS_NESTJS_SERVICE_NAME }}
