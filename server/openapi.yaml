openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
      tags:
        - App
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
      summary: POST /api/auth/login - ログイン開始
      tags:
        - Auth
  /api/auth/callback:
    get:
      operationId: AuthController_callback
      parameters:
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
        - name: error
          required: false
          in: query
          schema:
            type: string
        - name: error_description
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: |-
        GET /api/auth/callback - OAuth コールバック
        Google OAuth 認証後にリダイレクトされるエンドポイント
      tags:
        - Auth
  /api/auth/me:
    get:
      operationId: AuthController_getUserInfo
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
      summary: GET /api/auth/me - ユーザー情報取得
      tags:
        - Auth
  /api/auth/refresh:
    post:
      operationId: AuthController_refreshToken
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponseDto'
      summary: POST /api/auth/refresh - トークン更新
      tags:
        - Auth
  /api/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '200':
          description: ''
      summary: POST /api/auth/logout - ログアウト
      tags:
        - Auth
  /api/gdrive/list:
    get:
      operationId: GDriveController_listFolder
      parameters:
        - name: folderId
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListDto'
      summary: |-
        GET /api/gdrive/list
        フォルダ内容を取得
      tags:
        - GDrive
  /api/gdrive/search:
    get:
      operationId: GDriveController_search
      parameters:
        - name: folderId
          required: true
          in: query
          schema:
            type: string
        - name: query
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListDto'
      summary: |-
        GET /api/gdrive/search
        フォルダ内でキーワード検索
      tags:
        - GDrive
info:
  title: danmaku API
  description: Danmaku API documentation
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    LoginResponseDto:
      type: object
      properties:
        authorize_url:
          type: string
        state:
          type: string
        expires_in:
          type: number
      required:
        - authorize_url
        - state
        - expires_in
    UserInfoDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        picture_url:
          type: string
          nullable: true
        oauth_provider:
          type: string
        last_login:
          format: date-time
          type: string
          nullable: true
      required:
        - id
        - email
        - oauth_provider
    RefreshTokenResponseDto:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: number
      required:
        - access_token
        - expires_in
    FileItemDto:
      type: object
      properties:
        id:
          type: string
          description: ファイル/フォルダID
        name:
          type: string
          description: ファイル/フォルダ名
        mimeType:
          type: string
          description: |-
            MIME タイプ
            - 'application/vnd.google-apps.folder' = フォルダ
            - 'video/mp4' = MP4 ビデオ
        size:
          type: number
          description: |-
            ファイル/フォルダサイズ（バイト）
            フォルダの場合は null
        modifiedTime:
          type: string
          description: 最終更新日時（ISO 8601形式）
        webViewLink:
          type: string
          description: Google Drive WebView URL
        thumbnailLink:
          type: string
          description: サムネイル URL（ビデオファイルの場合のみ）
        parentId:
          type: string
          description: 親フォルダID
      required:
        - id
        - name
        - mimeType
        - modifiedTime
        - webViewLink
    FolderListDto:
      type: object
      properties:
        items:
          description: フォルダ内のファイル/フォルダ一覧
          type: array
          items:
            $ref: '#/components/schemas/FileItemDto'
        nextPageToken:
          type: string
          description: |-
            次のページトークン（ページネーション用）
            あれば指定してリクエスト
      required:
        - items
