openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
      tags:
        - App
  /api/auth/login/{provider}:
    post:
      operationId: AuthController_loginWithProvider
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
      summary: |-
        POST /api/auth/login/:provider - プロバイダー別ログイン開始
        例: POST /api/auth/login/onedrive
      tags:
        - Auth
  /api/auth/callback/{provider}:
    get:
      operationId: AuthController_callbackWithProvider
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
        - name: error
          required: false
          in: query
          schema:
            type: string
        - name: error_description
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: |-
        GET /api/auth/callback/:provider - プロバイダー別 OAuth コールバック
        例: GET /api/auth/callback/onedrive
      tags:
        - Auth
  /api/auth/me:
    get:
      operationId: AuthController_getUserInfo
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoDto'
      summary: GET /api/auth/me - ユーザー情報取得
      tags:
        - Auth
  /api/auth/refresh:
    post:
      operationId: AuthController_refreshToken
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponseDto'
      summary: POST /api/auth/refresh - トークン更新
      tags:
        - Auth
  /api/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '200':
          description: ''
      summary: POST /api/auth/logout - ログアウト
      tags:
        - Auth
  /api/drives:
    get:
      operationId: DriveConnectionController_list
      parameters: []
      responses:
        '200':
          description: ''
      summary: |-
        GET /api/drives
        接続済みドライブリストを取得
      tags:
        - DriveConnection
  /api/drives/{provider}/auth:
    post:
      operationId: DriveConnectionController_initiateConnection
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: |-
        POST /api/drives/:provider/auth
        プロバイダー別 OAuth 認可開始
        例: POST /api/drives/google/auth
            POST /api/drives/onedrive/auth
      tags:
        - DriveConnection
  /api/drives/{connectionId}:
    delete:
      operationId: DriveConnectionController_delete
      parameters:
        - name: connectionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: |-
        DELETE /api/drives/:connectionId
        接続を削除
      tags:
        - DriveConnection
  /api/drive/list:
    get:
      operationId: FolderController_listFolder
      parameters:
        - name: folderId
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListDto'
      summary: |-
        GET /api/drive/list （後方互換性用・Google Drive）
        フォルダ内容を取得
      tags:
        - Folder
  /api/drive/search:
    get:
      operationId: FolderController_search
      parameters:
        - name: folderId
          required: true
          in: query
          schema:
            type: string
        - name: query
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListDto'
      summary: |-
        GET /api/drive/search （後方互換性用・Google Drive）
        フォルダ内でキーワード検索
      tags:
        - Folder
  /api/drive/connections/{connectionId}/files:
    get:
      operationId: FolderController_listFolderByConnection
      parameters:
        - name: connectionId
          required: true
          in: path
          schema:
            type: string
        - name: folderId
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListDto'
      summary: |-
        GET /api/drive/connections/:connectionId/files
        特定のドライブ接続からフォルダ内容を取得（マルチプロバイダー対応）
      tags:
        - Folder
  /api/drive/connections/{connectionId}/search:
    get:
      operationId: FolderController_searchByConnection
      parameters:
        - name: connectionId
          required: true
          in: path
          schema:
            type: string
        - name: folderId
          required: true
          in: query
          schema:
            type: string
        - name: query
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListDto'
      summary: |-
        GET /api/drive/connections/:connectionId/search
        特定のドライブ接続内でキーワード検索（マルチプロバイダー対応）
      tags:
        - Folder
  /api/player/stream/{fileId}:
    get:
      operationId: PlayerController_streamVideo
      parameters:
        - name: fileId
          required: true
          in: path
          schema:
            type: string
        - name: range
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: 動画ファイルをストリーミング再生
      tags:
        - Player
  /api/player/comments/{videoFileId}:
    get:
      operationId: PlayerController_getComments
      parameters:
        - name: videoFileId
          required: true
          in: path
          schema:
            type: string
        - name: folderId
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DPlayerCommentListDto'
      summary: |-
        DPlayer 互換形式でコメントを取得

        コメントファイルの自動検出:
        - 動画: "aaa.mp4"
        - コメント: "aaa.xml" または "aaa.json" を自動検索
        - 見つかった場合: DPlayer 互換形式に変換して返す
        - 見つからない場合: 空配列を返す
      tags:
        - Player
  /api/player/token:
    post:
      operationId: PlayerController_generateVideoToken
      parameters: []
      responses:
        '200':
          description: ''
      summary: |-
        POST /api/player/token - 動画ストリーミング用トークン生成

        目的: モバイルアプリでの動画URL認証
        - URL クエリパラメータ ?token={jwt} で認証するためのトークンを生成
        - 有効期限: 15分（デフォルト）
      tags:
        - Player
  /api/nicovideo/download/comments:
    post:
      operationId: NicovideoController_downloadComments
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadCommentRequestDto'
      responses:
        '201':
          description: ''
      summary: |-
        POST /api/nicovideo/download/comments
        セッション不要 - thread_keyが取得できれば可能

        flow:
        1. getVideoMetadata() で HTML から thread_key を抽出
        2. thread_key が存在すればコメント取得可能
        3. thread_key が不在 = 非公開動画またはコメント機能無効
      tags:
        - Nicovideo
info:
  title: danmaku API
  description: Danmaku API documentation
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    LoginResponseDto:
      type: object
      properties:
        authorize_url:
          type: string
        state:
          type: string
        expires_in:
          type: number
      required:
        - authorize_url
        - state
        - expires_in
    DriveConnectionDto:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        account:
          type: string
        status:
          enum:
            - connected
            - expired
            - revoked
            - error
          type: string
        connected_at:
          format: date-time
          type: string
      required:
        - id
        - provider
        - account
        - status
        - connected_at
    UserInfoDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        picture_url:
          type: string
          nullable: true
        last_login:
          format: date-time
          type: string
          nullable: true
        drives:
          type: array
          items:
            $ref: '#/components/schemas/DriveConnectionDto'
      required:
        - id
        - email
        - drives
    RefreshTokenResponseDto:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: number
      required:
        - access_token
        - expires_in
    FileItemDto:
      type: object
      properties:
        id:
          type: string
          description: ファイル/フォルダID
        name:
          type: string
          description: ファイル/フォルダ名
        mimeType:
          type: string
          description: |-
            MIME タイプ
            - 'application/vnd.google-apps.folder' = フォルダ
            - 'video/mp4' = MP4 ビデオ
        size:
          type: number
          description: |-
            ファイル/フォルダサイズ（バイト）
            フォルダの場合は null
        modifiedTime:
          type: string
          description: 最終更新日時（ISO 8601形式）
        webViewLink:
          type: string
          description: Google Drive WebView URL
        thumbnailLink:
          type: string
          description: サムネイル URL（ビデオファイルの場合のみ）
        parentId:
          type: string
          description: 親フォルダID
      required:
        - id
        - name
        - mimeType
        - modifiedTime
        - webViewLink
    FolderListDto:
      type: object
      properties:
        items:
          description: フォルダ内のファイル/フォルダ一覧
          type: array
          items:
            $ref: '#/components/schemas/FileItemDto'
        nextPageToken:
          type: string
          description: |-
            次のページトークン（ページネーション用）
            あれば指定してリクエスト
      required:
        - items
    DPlayerCommentDto:
      type: object
      properties:
        time:
          type: number
          description: |-
            コメント表示時刻（秒単位の浮動小数点数）
            例: 10.5 (10秒500ミリ秒)
        type:
          type: string
          description: |-
            コメント種類
            - "normal" (中央)
            - "top" / "ue" (上)
            - "bottom" / "shita" (下)
        size:
          type: string
          description: |-
            コメント文字サイズ
            - "small" (小)
            - "normal" / "" (通常)
            - "big" (大)
        color:
          type: string
          description: |-
            コメント色（16進数カラーコード）
            例: "#ffffff" (白)
        author:
          type: string
          nullable: true
          description: コメント投稿者ID（匿名の場合は null）
        text:
          type: string
          description: コメント内容（テキスト）
      required:
        - time
        - type
        - size
        - color
        - text
    DPlayerCommentListDto:
      type: object
      properties:
        comments:
          description: DPlayer 互換コメント配列
          type: array
          items:
            $ref: '#/components/schemas/DPlayerCommentDto'
      required:
        - comments
    DownloadCommentRequestDto:
      type: object
      properties:
        videoId:
          type: string
        commentsLimit:
          type: number
          minimum: 1
        commentsFrom:
          type: number
          minimum: 0
      required:
        - videoId
